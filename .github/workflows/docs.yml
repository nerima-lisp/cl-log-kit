name: Publish documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write # configure-pages needs this to create the site when it is off.
    steps:
      - uses: actions/checkout@v7

      - uses: DeterminateSystems/nix-installer-action@v22

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@v17
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build documentation
        timeout-minutes: 10
        run: |
          set -euo pipefail
          nix build .#docs --print-build-logs
          cp -rL result public
          chmod -R u+w public

      # enablement: true makes this step turn Pages on (as a
      # build_type: workflow site) instead of failing with "Get Pages site
      # failed" when it is off. Without it the job's success depends on a
      # repository setting that lives outside the repository, which is
      # exactly how every documentation link in README.md, SUPPORT.md, and
      # docs/src/ came to point at a 404.
      - uses: actions/configure-pages@v6
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    name: Deploy documentation
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write # Publish the uploaded artifact to GitHub Pages.
      id-token: write # Authenticate the deployment with GitHub OIDC.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
