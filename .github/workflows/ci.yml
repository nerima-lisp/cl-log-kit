name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Every command this project runs enforces its own timeout (run-ci.lisp
    # wraps the test/coverage scripts via cl-process-kit; this bounds the
    # whole job — checkout, Nix install, and `nix flake check` together —
    # so a hang anywhere in the pipeline still fails fast instead of running
    # to GitHub's default 360-minute ceiling. Matches docs.yml's precedent.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v17

      - name: Configure Cachix
        if: ${{ vars.CACHIX_CACHE != '' }}
        uses: cachix/cachix-action@v16
        with:
          name: ${{ vars.CACHIX_CACHE }}
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check flake
        run: nix flake check --print-build-logs
