# cl-log-kit documentation — MkDocs + Material configuration.
#
# Build:   mkdocs build --strict -f docs/mkdocs.yml
# Serve:   mkdocs serve -f docs/mkdocs.yml
# The Nix flake (`nix build .#docs`) drives the same config offline.
#
# Run mkdocs from the repository root, not from docs/: pymdownx.snippets
# resolves base_path against the working directory, and docs/src/changelog.md
# includes the top-level CHANGELOG.md.

# Duplicated from the flake's --strict flag on purpose, so `mkdocs serve` and
# any other entry point apply the same gate instead of depending on a caller
# remembering the flag. Use `mkdocs serve --no-strict` while drafting.
strict: true

site_name: cl-log-kit
site_description: >-
  A dependency-free, SBCL-only structured logging toolkit for Common Lisp.
site_author: cl-log-kit contributors
site_url: https://nerima-lisp.github.io/cl-log-kit/

repo_name: nerima-lisp/cl-log-kit
repo_url: https://github.com/nerima-lisp/cl-log-kit
edit_uri: edit/main/docs/src/

# Content lives in docs/src.
docs_dir: src
site_dir: ../site
use_directory_urls: true

copyright: Copyright &copy; cl-log-kit contributors — MIT License

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/text-box-outline
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  font:
    text: Inter
    code: JetBrains Mono
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit

extra_css:
  - assets/stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/nerima-lisp/cl-log-kit
      name: cl-log-kit on GitHub
  generator: false

plugins:
  - search

markdown_extensions:
  # Callouts / admonitions.
  - admonition
  - pymdownx.details
  # Code blocks: syntax highlighting, line numbers, inline highlighting.
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  # base_path is resolved against the working directory mkdocs was started
  # from, which is the repository root. check_paths turns a missing include
  # into a build failure, matching what --strict does for broken links.
  - pymdownx.snippets:
      base_path:
        - "."
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Content tabs (e.g. the installation paths).
  - pymdownx.tabbed:
      alternate_style: true
  # Task lists, key bindings, smart symbols, emoji.
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
      title: On this page

# Six sections, fixed in this order, ordered by the reader's state: Getting
# Started is for someone who has not run it yet, Guide for someone who has,
# Reference for someone writing code and looking up an answer, Internals for
# someone changing the library, Project for someone contributing to it.
# Guide topics are in dependency order, not alphabetical: each page uses the
# vocabulary the ones above it introduced.
#
# --strict fails the build on a page that is not listed here, which is what
# keeps this nav from silently falling behind docs/src/.
nav:
  - Home: index.md
  - Getting Started:
      - Installation: installation.md
      - Quick Start: quick-start.md
  - Guide:
      - Levels: levels.md
      - Fields: fields.md
      - Logger Derivation and Context: context.md
      - Handlers: handlers.md
      - Logging Conditions: conditions.md
      - Log Spans: spans.md
      - Records and Extension: extension.md
  - Reference:
      - API Reference: api-reference.md
      - Compatibility: compatibility.md
  - Internals:
      - Benchmarks: benchmarks.md
  - Project:
      - Development: development.md
      - Changelog: changelog.md

# docs/notes/ holds measurements worth keeping but not worth publishing.
# Without this declaration --strict fails the build the moment one is added.
not_in_nav: |
  notes/
